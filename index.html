<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>N & F — Wedding Invitation</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Manrope:wght@300;400;500&display=swap');
:root{--g:#c89a42;--g2:#f1d58a;--ink:#2b241b;--iv:#fffaf0}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0e0b08;color:var(--ink);font-family:Manrope,sans-serif}
body{overflow-x:hidden}
.noise{position:fixed;inset:0;pointer-events:none;z-index:99;opacity:.06;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E")}
#gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 40%,#fffdf8 0,#f5e7ce 48%,#cfa85d 130%);transition:opacity 1s 1.7s,visibility 1s 1.7s}
#gate.hide{opacity:0;visibility:hidden}
.glow{position:absolute;width:70vmax;height:70vmax;border-radius:50%;background:radial-gradient(circle,#fff8dc66,transparent 65%);animation:float 7s ease-in-out infinite alternate}
@keyframes float{to{transform:translate(7vw,-5vh) scale(1.12)}}
.dust i{position:absolute;border-radius:50%;background:#d5a84e;box-shadow:0 0 14px #d5a84e;animation:drift var(--t) linear infinite}
@keyframes drift{0%{transform:translateY(105vh) scale(.3);opacity:0}15%{opacity:.7}100%{transform:translateY(-15vh) translateX(var(--x)) scale(1);opacity:0}}
.stage{width:min(88vw,520px);perspective:1400px;text-align:center;position:relative}
.open-title{font:italic 500 clamp(30px,7vw,50px) "Cormorant Garamond",serif;color:#8c6527;margin:0 0 26px;transition:.6s}
.env{position:relative;aspect-ratio:1.48;filter:drop-shadow(0 25px 32px #68491640);cursor:pointer;transform-style:preserve-3d}
.back{position:absolute;inset:0;border:1px solid #d3a852;border-radius:8px;background:linear-gradient(145deg,#fffdf7,#e9d4ae)}
.letter{position:absolute;left:6%;right:6%;bottom:5%;height:90%;z-index:2;border:1px solid #d5ae60;background:linear-gradient(#fffefa,#f7ecd9);box-shadow:0 15px 35px #6c4d2530;display:grid;place-items:center;transition:transform 1.25s .55s cubic-bezier(.16,.9,.2,1),opacity .7s 1.25s}
.letter span{font:500 44px "Cormorant Garamond",serif;color:#a97a2c;letter-spacing:.08em}
.front{position:absolute;inset:0;z-index:4;clip-path:polygon(0 24%,50% 67%,100% 24%,100% 100%,0 100%);background:linear-gradient(145deg,#f6ead4,#fffaf0 65%);border:1px solid #c89a42}
.flap{position:absolute;inset:0;z-index:5;clip-path:polygon(0 0,100% 0,50% 66%);background:linear-gradient(#fffdf8,#ead6b1);transform-origin:50% 0;transition:transform 1.15s cubic-bezier(.3,.75,.15,1),z-index 0s .6s;backface-visibility:hidden}
.seal{position:absolute;z-index:7;left:50%;top:52%;translate:-50% -50%;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font:500 30px "Cormorant Garamond",serif;color:#fff3c7;background:radial-gradient(circle at 32% 25%,#f7d97d,#b87b20 52%,#6f4310);border:4px double #f5d77e;box-shadow:0 10px 22px #70481770,inset 0 0 0 2px #9c671c;transition:.5s}
.tap{margin-top:26px;letter-spacing:.3em;text-transform:uppercase;color:#9b783f;font-size:10px}
.env.open .flap{transform:rotateX(180deg);z-index:1}.env.open .seal{transform:scale(.2) rotate(30deg);opacity:0}
.env.open .letter{transform:translateY(-80%) scale(1.07);opacity:0}
#site{min-height:100vh;background:linear-gradient(180deg,#fffdf9,#f6ead5 70%,#efe0c4);opacity:0;transition:opacity 1.2s 2s}
#site.show{opacity:1}
.hero{min-height:100svh;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:60px 18px 50px}
.hero:before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 50% 20%,#fff 0,transparent 35%),radial-gradient(circle at 20% 80%,#d7ac5a22,transparent 25%);animation:bgmove 9s ease-in-out infinite alternate}
@keyframes bgmove{to{transform:translateY(-3%) scale(1.05)}}
.content{position:relative;z-index:2;max-width:1050px;margin:auto;text-align:center;width:100%}
.eyebrow{font-size:10px;letter-spacing:.42em;text-transform:uppercase;color:#9d762f}
h1{font:500 clamp(58px,13vw,118px)/.78 "Cormorant Garamond",serif;margin:18px 0 14px;color:#9a6f29;letter-spacing:-.035em}
.intro{font:italic 500 clamp(19px,4.8vw,31px)/1.2 "Cormorant Garamond",serif;max-width:680px;margin:0 auto 34px}
.gallery{display:grid;grid-template-columns:.92fr 1.08fr .92fr;gap:clamp(7px,2vw,18px);align-items:center;max-width:900px;margin:20px auto 34px}
.card{position:relative;padding:clamp(4px,1vw,8px);border-radius:999px 999px 24px 24px;background:linear-gradient(135deg,#f6dda0 0,#9c681d 25%,#fff1bd 52%,#a76e1e 78%,#f3d58d);box-shadow:0 18px 35px #7d57252b;transform:translateY(50px) scale(.94);opacity:0;transition:1s cubic-bezier(.2,.8,.2,1)}
.card.reveal{transform:none;opacity:1}.card:nth-child(2){transition-delay:.16s;transform:translateY(20px) scale(.98)}.card:nth-child(2).reveal{transform:translateY(-15px) scale(1.02)}.card:nth-child(3){transition-delay:.32s}
.card:before{content:"";position:absolute;inset:3px;border:1px solid #fff7dc;border-radius:inherit;z-index:2;pointer-events:none}
.card img{width:100%;display:block;aspect-ratio:.72;object-fit:cover;border-radius:999px 999px 18px 18px;background:#eee}
.names{font:500 clamp(50px,12vw,96px) "Cormorant Garamond",serif;color:#9a6c24;margin:18px 0 0}
.line{width:min(320px,70vw);height:1px;background:linear-gradient(90deg,transparent,#bd9146,transparent);margin:8px auto 22px}
.quote{font:italic 500 clamp(20px,5vw,31px) "Cormorant Garamond",serif;max-width:650px;margin:auto}
.scroll{margin-top:35px;font-size:9px;letter-spacing:.35em;text-transform:uppercase;color:#9a793f;animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35;transform:translateY(5px)}}
@media(max-width:600px){.hero{padding-top:42px}.gallery{gap:7px}.card:nth-child(2).reveal{transform:translateY(-9px)}}
</style>
</head>
