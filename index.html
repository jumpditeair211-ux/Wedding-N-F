<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wedding N&F</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap');
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#ded8d2;color:#58473b;font-family:Montserrat,sans-serif}
.app{height:100svh;max-width:520px;margin:auto;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 25%,#fffefa,#f5eee6 72%)}
.screen{position:absolute;inset:0;overflow:hidden}
.gold{color:#b18a46;text-shadow:0 1px 0 #f7e7bd,0 2px 5px #9a712e33}
.decor{position:absolute;inset:16px;border:1px solid #b9985b88;pointer-events:none;z-index:20}
.corner{position:absolute;color:#b99759;font-size:43px;line-height:1;z-index:21}
.tl{top:27px;left:28px}.br{bottom:27px;right:28px;transform:rotate(180deg)}
/* ENVELOPE */
.envelope-screen{display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#fffefa,#f2e9e0);z-index:10}
.env-content{text-align:center;width:min(88vw,410px);animation:envEnter 1.2s both}
@keyframes envEnter{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:none}}
.invite-label{font-size:9px;letter-spacing:5px;text-transform:uppercase;margin-bottom:28px}
.envelope{width:100%;aspect-ratio:1.48;position:relative;cursor:pointer;filter:drop-shadow(0 24px 28px #5b402c30);perspective:1000px}
.env-back{position:absolute;inset:0;background:linear-gradient(145deg,#fffefd,#f4eee7);border:1px solid #d6c8b8;border-radius:5px;box-shadow:inset 0 0 0 5px #faf7f1}
.env-left,.env-right,.env-bottom{position:absolute;z-index:2;background:linear-gradient(145deg,#fff,#f1e9df);border:1px solid #d7c8b7}
.env-left{left:0;top:0;width:51%;height:100%;clip-path:polygon(0 0,100% 50%,0 100%);border-right:0}
.env-right{right:0;top:0;width:51%;height:100%;clip-path:polygon(100% 0,0 50%,100% 100%);border-left:0}
.env-bottom{left:0;bottom:0;width:100%;height:58%;clip-path:polygon(0 100%,50% 0,100% 100%);border-top:0}
.env-flap{position:absolute;z-index:5;left:0;top:0;width:100%;height:66%;background:linear-gradient(155deg,#fffefa,#eee4d9);clip-path:polygon(0 0,100% 0,50% 100%);border:1px solid #d4c4b2;transform-origin:top center;transition:transform 1.35s cubic-bezier(.68,-.15,.25,1.25);backface-visibility:hidden}
.envelope.open .env-flap{transform:rotateX(180deg)}
.seal-ring{position:absolute;z-index:7;left:50%;top:54%;width:91px;height:91px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#e4c98d 0,#bc914c 52%,#8d642c 100%);border:3px double #f2dca7;box-shadow:0 8px 18px #6b472455, inset 0 0 0 5px #caa665;display:grid;place-items:center;color:#fff;font:38px "Cormorant Garamond";transition:opacity .45s .15s,transform .7s}
.envelope.open .seal-ring{opacity:0;transform:translate(-50%,-50%) scale(.5)}
.seal-ring span{border:1px solid #f4dfac;border-radius:50%;width:64px;height:64px;display:grid;place-items:center}
.env-ribbon{position:absolute;z-index:6;left:50%;top:0;bottom:0;width:1px;background:#c6a66d77}
.env-hint{margin-top:28px;font:500 15px "Cormorant Garamond";letter-spacing:1px;animation:pulse 1.8s infinite}
.env-hint small{display:block;font:9px Montserrat;letter-spacing:2px;text-transform:uppercase;margin-top:6px;color:#9a7c55}
@keyframes pulse{50%{opacity:.45;transform:translateY(2px)}}
/* WELCOME */
.welcome{opacity:0;transform:scale(1.08);pointer-events:none;transition:opacity .7s,transform 1s cubic-bezier(.2,.8,.2,1);overflow:auto}
.opened .welcome{opacity:1;transform:scale(1);pointer-events:auto}
.welcome-inner{min-height:100%;padding:55px 27px 55px;display:flex;align-items:center;flex-direction:column;text-align:center}
.kicker{font-size:9px;letter-spacing:4px;text-transform:uppercase;color:#a07e49;opacity:0;transform:translateY(25px)}
.opened .kicker{animation:rise .8s .35s forwards}
h1{font:600 49px/.82 "Cormorant Garamond";margin:18px 0;color:#a77b35;opacity:0;transform:translateY(35px);text-shadow:0 1px 0 #f8e9c5,0 3px 7px #9c712c33}
.opened h1{animation:rise 1s .5s forwards}
.amp{font-size:30px;font-style:italic;color:#c19a58}
.photo-frame{width:min(88vw,395px);padding:8px;background:#fff;border:1px solid #ad8344;box-shadow:0 18px 45px #60452b2c;opacity:0;transform:translateY(45px) scale(.94);position:relative}
.opened .photo-frame{animation:photoIn 1s .75s forwards}
.photo-frame:before{content:"";position:absolute;inset:4px;border:1px solid #d9bc7c;z-index:2;pointer-events:none}
.photo-frame img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;object-position:center 48%}
.gold-line{width:90px;height:1px;background:#b18a46;margin:23px auto 0;opacity:0}
.opened .gold-line{animation:fade .7s 1.25s forwards}
.msg{font:25px "Cormorant Garamond";color:#9a743c;margin-top:18px;opacity:0}
.opened .msg{animation:rise .8s 1.35s forwards}
.date{font-size:9px;letter-spacing:3px;color:#9d815c;margin-top:6px;opacity:0}.opened .date{animation:rise .8s 1.5s forwards}
@keyframes rise{to{opacity:1;transform:none}}@keyframes photoIn{to{opacity:1;transform:none}}@keyframes fade{to{opacity:1}}
</style>
</head>

<section class="screen envelope-screen" id="envelopeScreen">
<div class="decor"></div><div class="corner tl">❦</div><div class="corner br">❦</div>

<div class="invite-label gold">A special invitation</div>

<div class="env-ribbon"></div><div class="env-flap"></div>
<div class="seal-ring"><span>♥</span></div>
</div>
<div class="env-hint gold">Tap the seal to open<small>Touch the screen</small></div>
</div>
</section>
