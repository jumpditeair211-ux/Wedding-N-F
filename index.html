<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>N & F — Wedding Invitation</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Italiana&family=Montserrat:wght@300;400;500&display=swap');
:root{--gold:#c59a47;--deep:#8c6728;--ivory:#fffaf0;--cream:#f5ead6;--ink:#382b1c}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(circle at 50% 0,#fffdf8,#f2e6d2 70%,#e7d3b1);color:var(--ink);font-family:Montserrat,sans-serif;overflow-x:hidden}
#intro{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:
radial-gradient(circle at 20% 15%,rgba(255,255,255,.95),transparent 32%),
linear-gradient(145deg,#fffdf8,#ead7b7);transition:opacity .9s ease,visibility .9s}
#intro.gone{opacity:0;visibility:hidden}
.sparkles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.sparkles i{position:absolute;width:4px;height:4px;background:#d8ae59;border-radius:50%;box-shadow:0 0 12px #d8ae59;animation:twinkle 2.5s infinite alternate}
@keyframes twinkle{from{opacity:.15;transform:scale(.5)}to{opacity:1;transform:scale(1.5)}}
.envelope-wrap{width:min(88vw,520px);text-align:center;perspective:1200px}
.hint{font-family:"Cormorant Garamond",serif;font-size:clamp(26px,6vw,42px);font-style:italic;color:#8c6728;margin-bottom:24px}
.envelope{position:relative;width:100%;aspect-ratio:1.55;background:linear-gradient(145deg,#fffdf7,#efe2cb);border:2px solid #d2ad65;border-radius:8px;box-shadow:0 25px 70px #7b5b2835;cursor:pointer}
.envelope:before,.envelope:after{content:"";position:absolute;inset:0;pointer-events:none}
.envelope:before{clip-path:polygon(0 100%,0 18%,50% 64%,100% 18%,100% 100%);background:linear-gradient(145deg,#f7edda,#fffaf1);border-bottom:2px solid #d2ad65;z-index:3}
.flap{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 62%);background:linear-gradient(#fffdf8,#ead9bb);transform-origin:50% 0;z-index:4;transition:transform 1.15s cubic-bezier(.2,.7,.1,1)}
.letter{position:absolute;left:7%;right:7%;bottom:5%;height:82%;background:#fffdf7;border:1px solid #d5b36f;border-radius:5px;z-index:2;display:grid;place-items:center;transition:transform 1.1s .55s cubic-bezier(.2,.75,.1,1);box-shadow:0 10px 30px #9b77342b}
.letter-inner{font-family:"Italiana",serif;color:#a47a30;letter-spacing:.12em;font-size:clamp(24px,6vw,44px)}
.seal{position:absolute;z-index:6;left:50%;top:47%;transform:translate(-50%,-50%);width:82px;height:82px;border-radius:50%;border:2px solid #f4d58c;background:radial-gradient(circle at 30% 25%,#f6d47f,#b17820 55%,#754815);display:grid;place-items:center;color:#fff4d1;font-family:"Cormorant Garamond",serif;font-size:29px;box-shadow:0 7px 18px #6f481c66,inset 0 0 0 4px #9f6d24;transition:.5s}
.envelope.open .flap{transform:rotateX(180deg);z-index:1}
.envelope.open .letter{transform:translateY(-58%) scale(1.03);z-index:5}
.envelope.open .seal{opacity:0;transform:translate(-50%,-30%) scale(.7)}
.open-label{margin-top:24px;text-transform:uppercase;letter-spacing:.25em;font-size:11px;color:#94733c}
main{opacity:0;transform:translateY(30px);transition:1.2s ease;padding:42px 18px 70px}
main.show{opacity:1;transform:none}
.hero{max-width:950px;margin:auto;text-align:center}
.kicker{letter-spacing:.35em;text-transform:uppercase;font-size:11px;color:#a47a30}
h1{font-family:"Cormorant Garamond",serif;font-size:clamp(54px,13vw,112px);font-weight:500;line-height:.85;margin:16px 0;color:#a2762d;text-shadow:0 2px 0 #fff}
.sub{font-family:"Cormorant Garamond",serif;font-size:clamp(22px,5vw,34px);font-style:italic;margin:0 auto 38px;max-width:700px}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:center;margin:30px auto 40px}
.frame{position:relative;padding:8px;background:linear-gradient(135deg,#f8e7b5,#9f7028,#fff1c4,#b47e2d);border-radius:160px 160px 24px 24px;box-shadow:0 18px 35px #7755222c}
.frame:after{content:"";position:absolute;inset:4px;border:1px solid #fff7df;border-radius:inherit;pointer-events:none}
.frame img{display:block;width:100%;aspect-ratio:.73;object-fit:cover;border-radius:152px 152px 18px 18px;background:white}
.frame:nth-child(2){transform:translateY(-18px)}
.quote{max-width:700px;margin:0 auto;padding:26px;border-top:1px solid #cda85f;border-bottom:1px solid #cda85f;font-family:"Cormorant Garamond",serif;font-size:clamp(20px,4vw,29px)}
.mono{margin:36px 0 8px;font-family:"Italiana",serif;font-size:18px;letter-spacing:.25em;color:#9c722f}
footer{text-align:center;margin-top:38px;color:#9c7c49;font-size:10px;letter-spacing:.22em;text-transform:uppercase}
@media(max-width:650px){
 .gallery{gap:8px;margin-top:24px}
 .frame{padding:4px;border-radius:80px 80px 14px 14px}
 .frame img{border-radius:76px 76px 10px 10px}
 .frame:nth-child(2){transform:translateY(-10px)}
}
</style>
</head>
<body>
<section id="intro">
 <div class="sparkles" aria-hidden="true"></div>
 <div class="envelope-wrap">
   <div class="hint">Open this envelope</div>
   <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Open this envelope">
     <div class="letter"><div class="letter-inner">N &amp; F</div></div>
     <div class="flap"></div>
     <div class="seal">N&amp;F</div>
   </div>
   <div class="open-label">Tap the golden seal</div>
 </div>
</section>

<main id="main">
 <section class="hero">
   <div class="kicker">Welcome to our</div>
   <h1>Wedding Invitation</h1>
   <p class="sub">Deux cœurs, une même destination — une histoire écrite à deux, pour toute une vie.</p>
   <div class="gallery">
     <div class="frame"><img src="couple-1.jpg" alt="N & F"></div>
     <div class="frame"><img src="couple-2.jpg" alt="N & F"></div>
     <div class="frame"><img src="couple-3.jpg" alt="N & F"></div>
   </div>
   <div class="mono">N &amp; F</div>
   <div class="quote">« Là où commence notre pour toujours. »</div>
   <footer>Golden &amp; White • Wedding Invitation</footer>
 </section>
</main>

<script>
const env=document.getElementById('envelope'),intro=document.getElementById('intro'),main=document.getElementById('main');
function openInvite(){
 if(env.classList.contains('open')) return;
 env.classList.add('open');
 setTimeout(()=>{intro.classList.add('gone');main.classList.add('show');window.scrollTo(0,0)},1900);
}
env.addEventListener('click',openInvite);
env.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openInvite()}});
const s=document.querySelector('.sparkles');
for(let i=0;i<34;i++){let d=document.createElement('i');d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';d.style.animationDelay=Math.random()*2.5+'s';s.appendChild(d)}
</script>
</body>
</html>
